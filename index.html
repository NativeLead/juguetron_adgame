<title>Juguetron 300x600</title>
<script>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  /* fondo blanco y anuncio centrado en pantalla; dentro de un iframe de 300x600 queda exacto, sin desplazamiento */
  html{width:100%;height:100%;display:flex;background:#fff}
  body{width:300px;height:600px;margin:auto;overflow:hidden;background:#00ad5e;flex:none}
  #ad{position:relative;width:300px;height:600px;overflow:hidden;font-family:Poppins,"Arial Rounded MT Bold",Arial,sans-serif;
      background:radial-gradient(circle at 50% 38%,#009a53 0%,#009a53 55%,#009a53 100%);
      -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  /* marco de 1px dibujado por dentro: el anuncio sigue midiendo exactamente 300x600 */
  #ad:after{content:"";position:absolute;inset:0;border:1px solid #4D4D4D;z-index:50;pointer-events:none}
  #snow{position:absolute;inset:0;z-index:1;pointer-events:none}
  #header{position:absolute;left:0;top:0;width:300px;height:83px;z-index:3;cursor:pointer;display:block}
  #title{position:absolute;top:89px;left:0;width:300px;z-index:3;text-align:center;color:#fff;font-weight:800;font-size:17px;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
  #title b{display:inline-block;margin-left:6px;padding:1px 10px 0;border-radius:20px;background:#FFD21F;color:#C8102E;font-size:15px;text-shadow:none;vertical-align:2px}
  #gallery{position:absolute;left:0;top:122px;width:300px;height:212px;z-index:2;cursor:grab}
  .card{position:absolute;left:0;top:0;width:176px;height:206px;margin-left:-88px;border-radius:16px;background:#fff;
        box-shadow:0 6px 14px rgba(0,0,0,.22);padding:8px 10px 0;text-align:center;will-change:transform,opacity;cursor:pointer}
  .card img{display:block;width:118px;height:118px;margin:0 auto;pointer-events:none}
  .badge{position:absolute;top:8px;left:8px;background:#E3262F;color:#fff;font-weight:800;font-size:12px;padding:2px 7px;border-radius:10px}
  .name{font-weight:600;font-size:11px;line-height:13px;color:#333;height:26px;overflow:hidden;margin-top:4px}
  .price{margin-top:4px;font-weight:800;font-size:19px;color:#E3262F;line-height:22px}
  .price s{font-weight:600;font-size:11px;color:#999;margin-left:4px}
  #cloud{position:absolute;left:0;top:440px;width:300px;height:160px;z-index:2}
  #train{position:absolute;left:0;top:340px;width:120px;height:120px;z-index:4;cursor:grab;touch-action:none}
  #train svg{width:120px;height:120px;display:block;overflow:visible}
  #hint{position:absolute;top:318px;left:0;z-index:5;pointer-events:none;background:#FFD21F;color:#C8102E;font-weight:800;font-size:11px;
        padding:3px 9px 2px;border-radius:12px;white-space:nowrap;box-shadow:0 2px 0 #C79A00;transition:opacity .3s}
  #hint:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#FFD21F}
  #copy{position:absolute;top:474px;left:0;width:300px;z-index:3;text-align:center;color:#fff;pointer-events:none;
        font-family:Chewy,"Arial Rounded MT Bold",Arial,sans-serif;font-size:21px;line-height:23px;letter-spacing:.3px;
        text-shadow:0 2px 0 #00ad5e,0 3px 0 #00ad5e,0 4px 4px rgba(0,0,0,.25)}
  #copy span{display:inline-block;animation:bounce 1.8s ease-in-out infinite}
  #copy .y{color:#FFD21F}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-2px) rotate(calc(var(--r) * -1))}}
  #cta{position:absolute;top:530px;left:65px;width:170px;height:40px;z-index:3;border:0;border-radius:22px;cursor:pointer;
       background:linear-gradient(#FFDA2E,#F5B800);box-shadow:0 4px 0 #C98F00;color:#fff;font:800 17px Poppins,Arial,sans-serif;
       text-shadow:-1px -1px 0 #8A5A00,1px -1px 0 #8A5A00,-1px 1px 0 #8A5A00,1px 1px 0 #8A5A00;animation:pulse 1.1s ease-in-out infinite}
  #cta:active{transform:translateY(3px);box-shadow:0 1px 0 #C98F00}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 4px 0 #C98F00,0 0 0 0 rgba(255,218,46,.6)}
                   50%{transform:scale(1.08);box-shadow:0 4px 0 #C98F00,0 0 0 9px rgba(255,218,46,0)}}
  .orn{position:absolute;top:80px;z-index:6;width:24px;margin-left:-12px;transform-origin:12px 0;pointer-events:none;animation:swing 2.4s ease-in-out infinite alternate}
  .orn svg{display:block;width:24px;overflow:visible}
  @keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
  #legal{position:absolute;bottom:6px;left:0;width:300px;text-align:center;z-index:3;color:rgba(255,255,255,.75);font-size:7.5px;font-family:Arial,sans-serif;pointer-events:none}
</style>

    {img:"https://res.cloudinary.com/bwmcpwyf/image/upload/v1794852369/rubik.jpg",    name:"Rubik's 4x4",                           price:"$151.60", old:"$379.00", off:"-60%"},
    {img:"https://res.cloudinary.com/bwmcpwyf/image/upload/v1794852369/techdeck.jpg", name:"Tech Deck 6 Pack de Patinetas",         price:"$223.60", old:"$559.00", off:"-60%"},
    {img:"https://res.cloudinary.com/bwmcpwyf/image/upload/v1794852369/naruto.jpg",   name:"Naruto Mini Peluche",                   price:"$135.60", old:"$339.00", off:"-60%"}
  ];
  var N = PROMOS.length, STEP = 188, TRAIN_W = 120, RANGE = 300 - TRAIN_W, PX_PER_ITEM = RANGE / (N - 1);
  var WHEEL_R = 237 * TRAIN_W / 1830;   // radio de la rueda grande en px

  function exit(){ window.open(window.clickTag, "_blank"); }

  var $ = function(id){ return document.getElementById(id); };
  var gallery = $("gallery"), train = $("train"), hint = $("hint");
  var cards = PROMOS.map(function(p){
    var c = document.createElement("div"); c.className = "card";
    c.innerHTML = '<span class="badge">' + p.off + '</span><img src="' + p.img + '" alt=""><div class="name">' + p.name +
                  '</div><div class="price">' + p.price + '<s>' + p.old + '</s></div>';
    gallery.appendChild(c); return c;
  });

  // ---------- Esferas navideñas colgando del header ----------
  var ORN = [ // x, largo del hilo, color, color oscuro, duración, retraso
    [13, 50, "#E3262F", "#9E1020", 2.2, 0], [35, 20, "#FFD21F", "#C99A00", 2.6, .4],
    [266, 24, "#FFD21F", "#C99A00", 2.4, .2], [288, 48, "#E3262F", "#9E1020", 2.0, .6]
  ];
  ORN.forEach(function(o, i){
    var d = document.createElement("div"); d.className = "orn";
    d.style.left = o[0] + "px"; d.style.animationDuration = o[4] + "s"; d.style.animationDelay = (-o[5]) + "s";
    var L = o[1], cy = L + 13;
    d.innerHTML = '<svg viewBox="0 0 24 ' + (cy + 12) + '" height="' + (cy + 12) + '">' +
      '<defs><radialGradient id="og' + i + '" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/>' +
      '<stop offset=".25" stop-color="' + o[2] + '"/><stop offset="1" stop-color="' + o[3] + '"/></radialGradient></defs>' +
      '<line x1="12" y1="0" x2="12" y2="' + (L - 1) + '" stroke="#fff" stroke-width="1.3"/>' +
      '<rect x="8.5" y="' + (L - 2) + '" width="7" height="5" rx="1" fill="#F2CC33" stroke="#B8860B" stroke-width=".6"/>' +
      '<circle cx="12" cy="' + cy + '" r="10" fill="url(#og' + i + ')"/>' +
      '<path d="M4,' + (cy + 1) + ' Q12,' + (cy + 5) + ' 20,' + (cy + 1) + '" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" fill="none"/></svg>';
    $("ornaments").appendChild(d);
  });

  // ---------- Estado ----------
  var pos = 0, target = 0, dragging = null, moved = false, interacted = false, lastX = 0;
  var phase = 0, facing = 1, t0 = performance.now(), lastUser = -1e9, dir = 1;
  var AUTO_END = 30000;   // el recorrido automático se detiene a los 30 s (la nieve sigue)

  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

  // ---------- Arrastre (tren y galería) ----------
  function start(e, kind){
    dragging = {kind:kind, x:e.clientX, pos:pos, card:(e.target.closest ? e.target.closest(".card") : null)}; moved = false;
    if (e.target.setPointerCapture) try { e.target.setPointerCapture(e.pointerId); } catch(_){}
    if (!interacted){ interacted = true; hint.style.opacity = 0; }
    lastUser = performance.now();
    e.preventDefault();
  }
  train.addEventListener("pointerdown", function(e){ start(e, "train"); });
  gallery.addEventListener("pointerdown", function(e){ start(e, "gallery"); });
  window.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - dragging.x;
    if (Math.abs(dx) > 5) moved = true;
    pos = target = clamp(dragging.kind === "train" ? dragging.pos + dx / PX_PER_ITEM : dragging.pos - dx / STEP, 0, N - 1);
    lastUser = performance.now();
  });
  function end(e){
    if (!dragging) return;
    var kind = dragging.kind, card = dragging.card; dragging = null;
    target = Math.round(pos);
    if (!moved && kind === "gallery") {
      // toque sin arrastre: si es la tarjeta del centro, abre destino; si es lateral, la centra
      if (card) { var i = cards.indexOf(card); if (i === Math.round(pos)) exit(); else target = i; }
    }
    lastUser = performance.now();
  }
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
  $("cta").addEventListener("click", exit);
  $("header").addEventListener("click", exit);

  // ---------- Nieve ----------
  var sc = $("snow").getContext("2d"), flakes = [];
  for (var i = 0; i < 34; i++) flakes.push({x:Math.random()*300, y:Math.random()*600, r:1 + Math.random()*2.6, v:18 + Math.random()*40, a:Math.random()*6.28});
  function drawSnow(dt, on){
    sc.clearRect(0, 0, 300, 600);
    if (!on) return;
    sc.fillStyle = "rgba(255,255,255,.85)";
    for (var i = 0; i < flakes.length; i++){
      var f = flakes[i];
      f.y += f.v * dt; f.a += dt; f.x += Math.sin(f.a) * 0.3;
      if (f.y > 605){ f.y = -5; f.x = Math.random()*300; }
      sc.beginPath(); sc.arc(f.x, f.y, f.r, 0, 6.283); sc.fill();
    }
  }

  // ---------- Tren ----------
  var bodyG = $("body"), smoke = $("smoke"), rod = $("rod"), pinA = $("pinA"), pinB = $("pinB"), flip = $("flip");
  function drawTrain(x, now){
    var d = x - lastX; lastX = x;
    if (Math.abs(d) > 0.3) facing = d > 0 ? 1 : -1;
    phase -= d / WHEEL_R * facing;
    var ax = 657 + 42*Math.cos(phase), ay = 1575 + 42*Math.sin(phase);
    var bx = 1243 + 32*Math.cos(phase), by = 1527 + 32*Math.sin(phase);
    rod.setAttribute("x1", ax); rod.setAttribute("y1", ay); rod.setAttribute("x2", bx); rod.setAttribute("y2", by);
    pinA.setAttribute("transform", "translate(" + ax + "," + ay + ")");
    pinB.setAttribute("transform", "translate(" + bx + "," + by + ")");
    var bob = Math.abs(Math.sin(phase)) * 14, rock = Math.sin(phase) * 0.9;
    bodyG.setAttribute("transform", "translate(0," + (-bob) + ") rotate(" + rock + " 900 1500)");
    var s = now / 1000, k = (1 - Math.cos(2 * phase)) / 2;
    var sway = Math.sin(2 * Math.PI * s / 1.8) * 1.6, skew = 2 + 2 * Math.sin(2 * Math.PI * s / 2.2);
    var sx = 1 + 0.035*k + 0.015*Math.sin(2*Math.PI*s/1.3), sy = 1 + 0.03*k - 0.012*Math.sin(2*Math.PI*s/1.3);
    smoke.setAttribute("transform", "translate(1375,815) rotate(" + sway + ") skewX(" + skew + ") scale(" + sx + "," + sy + ") translate(-1375,-815)");
    flip.setAttribute("transform", facing < 0 ? "translate(1830,0) scale(-1,1)" : "");
    train.style.transform = "translateX(" + x + "px)";
    hint.style.transform = "translateX(" + (x + TRAIN_W/2 - hint.offsetWidth/2) + "px)";
  }

  // ---------- Bucle ----------
  var prev = performance.now(), nextAuto = 2600;
  function frame(now){
    var dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    var el = now - t0, auto = el < AUTO_END;
    // autoplay: el tren va y viene por las promos hasta el primer contacto o 30 s
    if (auto && !dragging && now - lastUser > 5000 && el > nextAuto){
      nextAuto = el + 2600;
      if (target + dir > N - 1 || target + dir < 0) dir = -dir;
      target = Math.round(target) + dir;
    }
    if (!dragging) pos += (target - pos) * Math.min(1, dt * 4.5);
    for (var i = 0; i < N; i++){
      var off = i - pos, a = Math.min(1, Math.abs(off));
      cards[i].style.transform = "translateX(" + (150 + off * STEP) + "px) scale(" + (1 - 0.14 * a) + ")";
      cards[i].style.opacity = 1 - 0.35 * a;
      cards[i].style.zIndex = 10 - Math.round(Math.abs(off) * 2);
    }
    drawTrain(pos * PX_PER_ITEM, now);
    drawSnow(dt, true);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
